<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนสัญญาจ้างและออกเอกสาร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        darkcard: '#1e1e1e',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #f59e0b;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <!-- Add Google Font for Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-darkbg text-gray-200 min-h-screen p-4 md:p-8">
    
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-amber-400">ระบบสแกนสัญญาจ้าง</h1>
            <p class="text-gray-400">สร้างเอกสารบันทึกควบคุมงานอัตโนมัติ</p>
        </div>

        <!-- API Key & File Upload Section -->
        <div class="bg-darkcard p-6 rounded-xl shadow-lg border border-gray-800 space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-amber-200 mb-1">Gemini API Key</label>
                <input type="password" id="apiKey" class="w-full bg-darkbg border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-amber-400" placeholder="ใส่ API Key ของคุณที่นี่">
                <p class="text-xs text-gray-500 mt-1">*ระบบทำงานฝั่ง Client-side (เบราว์เซอร์) คีย์ของคุณจะไม่ถูกบันทึกลงเซิร์ฟเวอร์</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-amber-200 mb-1">อัปโหลดสัญญาจ้าง (PDF, รูปภาพ, TXT, Word ฯลฯ)</label>
                <input type="file" id="fileInput" multiple accept=".pdf, image/*, .txt, .doc, .docx, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, text/plain" class="block w-full text-sm text-gray-400
                    file:mr-4 file:py-2 file:px-4
                    file:rounded file:border-0
                    file:text-sm file:font-semibold
                    file:bg-amber-400 file:text-darkbg
                    hover:file:bg-amber-500
                    cursor-pointer">
            </div>

            <button id="scanBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-darkbg font-bold py-2 px-4 rounded transition duration-200 flex items-center justify-center gap-2">
                <span>สแกนและดึงข้อมูล</span>
                <div id="scanLoader" class="loader"></div>
            </button>
            <div id="scanStatus" class="text-sm text-center hidden"></div>
        </div>

        <!-- Dynamic Form Section -->
        <div id="formSection" class="bg-darkcard p-6 rounded-xl shadow-lg border border-gray-800 hidden space-y-6">
            <h2 class="text-xl font-bold text-amber-400 border-b border-gray-700 pb-2">ตรวจสอบและแก้ไขข้อมูล</h2>
            <div id="dynamicFields" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Fields will be injected here -->
            </div>
            <button id="exportBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition duration-200">
                สร้างและดาวน์โหลดเอกสาร (.docx)
            </button>
        </div>

    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.4/pizzip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // State variables
        let templateBuffer = null;
        let variablesList = [];
        
        // DOM Elements
        const apiKeyInput = document.getElementById('apiKey');
        const fileInput = document.getElementById('fileInput');
        const scanBtn = document.getElementById('scanBtn');
        const scanLoader = document.getElementById('scanLoader');
        const scanStatus = document.getElementById('scanStatus');
        const formSection = document.getElementById('formSection');
        const dynamicFields = document.getElementById('dynamicFields');
        const exportBtn = document.getElementById('exportBtn');

        // Initialize and load remote assets
        async function loadAssets() {
            try {
                scanStatus.textContent = "กำลังโหลด Template และ Variables จาก GitHub...";
                scanStatus.className = "text-sm text-center text-amber-300 block";

                const [templateRes, varsRes] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/leaveneass113-svg/my-doc-template/main/template.docx'),
                    fetch('https://raw.githubusercontent.com/leaveneass113-svg/my-doc-template/main/template_variables.txt')
                ]);

                if (!templateRes.ok || !varsRes.ok) throw new Error("โหลดทรัพยากรไม่สำเร็จ");

                templateBuffer = await templateRes.arrayBuffer();
                const varsText = await varsRes.text();
                
                // Parse variables list, ignoring empty lines
                variablesList = varsText.split('\n').map(v => v.trim()).filter(v => v.length > 0);
                
                scanStatus.textContent = "พร้อมใช้งาน (โหลด Template สำเร็จ)";
                scanStatus.className = "text-sm text-center text-green-400 block";
            } catch (error) {
                console.error(error);
                scanStatus.textContent = "เกิดข้อผิดพลาดในการโหลด Template: " + error.message;
                scanStatus.className = "text-sm text-center text-red-500 block";
            }
        }

        // Convert File to Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve({
                        inlineData: {
                            data: base64String,
                            mimeType: file.type
                        }
                    });
                };
                reader.onerror = error => reject(error);
            });
        }

        // Scan Document using Gemini
        scanBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const files = fileInput.files;

            if (!apiKey) {
                alert("กรุณาใส่ Gemini API Key");
                return;
            }
            if (files.length === 0) {
                alert("กรุณาอัปโหลดไฟล์สัญญาจ้าง");
                return;
            }
            if (variablesList.length === 0) {
                alert("รอการโหลดตัวแปรจาก GitHub สักครู่...");
                return;
            }

            try {
                // UI Loading state
                scanBtn.disabled = true;
                scanLoader.style.display = 'inline-block';
                scanStatus.textContent = "กำลังประมวลผลด้วย AI (อาจใช้เวลาสักครู่)...";
                scanStatus.className = "text-sm text-center text-amber-300 block";
                formSection.classList.add('hidden');

                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

                const parts = [];
                const prompt = `
You are an expert document extraction system.
I will provide a contract document (image, pdf, text, or word document).
Extract the following variables from the document and return ONLY a valid JSON object where keys are exactly these variables, and values are the extracted text in Thai language. If a variable is not found, leave its value as an empty string "". 
DO NOT include markdown tags like \`\`\`json. Just the raw JSON object.

Variables to extract:
${variablesList.join(', ')}
`;
                parts.push(prompt);
                
                for (let i = 0; i < files.length; i++) {
                    const filePart = await fileToBase64(files[i]);
                    parts.push(filePart);
                }

                const result = await model.generateContent(parts);
                let responseText = result.response.text().trim();
                
                // Clean up possible markdown json block
                if (responseText.startsWith('```json')) {
                    responseText = responseText.replace(/```json/g, '').replace(/```/g, '').trim();
                } else if (responseText.startsWith('```')) {
                    responseText = responseText.replace(/```/g, '').trim();
                }

                const extractedData = JSON.parse(responseText);

                // Render Dynamic Form
                dynamicFields.innerHTML = '';
                variablesList.forEach(variable => {
                    const value = extractedData[variable] || "";
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <label class="block text-sm font-medium text-amber-200 mb-1">${variable}</label>
                        <input type="text" data-var="${variable}" value="${value.replace(/"/g, '&quot;')}" class="w-full bg-darkbg border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-amber-400">
                    `;
                    dynamicFields.appendChild(div);
                });

                scanStatus.textContent = "สแกนสำเร็จ กรุณาตรวจสอบข้อมูล";
                scanStatus.className = "text-sm text-center text-green-400 block";
                formSection.classList.remove('hidden');

                scanBtn.disabled = false;
                scanLoader.style.display = 'none';

            } catch (error) {
                console.error(error);
                scanStatus.textContent = "เกิดข้อผิดพลาด: " + error.message;
                scanStatus.className = "text-sm text-center text-red-500 block";
            } finally {
                scanBtn.disabled = false;
                scanLoader.style.display = 'none';
            }
        });

        // Export Document
        exportBtn.addEventListener('click', () => {
            if (!templateBuffer) {
                alert("ไม่พบ Template กรุณารีเฟรชหน้าเว็บ");
                return;
            }

            try {
                // Collect data from inputs
                const data = {};
                const inputs = dynamicFields.querySelectorAll('input[data-var]');
                inputs.forEach(input => {
                    const varName = input.getAttribute('data-var');
                    data[varName] = input.value;
                });

                // Generate Document
                const zip = new PizZip(templateBuffer);
                const doc = new window.docxtemplater(zip, {
                    paragraphLoop: true,
                    linebreaks: true,
                });

                doc.render(data);

                const out = doc.getZip().generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                });

                saveAs(out, "Contract_Export.docx");

            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการสร้างเอกสาร: " + error.message);
            }
        });

        // Run on load
        window.addEventListener('DOMContentLoaded', loadAssets);

    </script>
</body>
</html>
